function quality(){let a=D.audit;return`<div class="grid kpis">${card('Meta rows',N(a.meta_rows))}${card('Unique Ads',N(a.ads))}${card('CRM deals',N(a.rows))}${card('Exact matches',N(a.exact))}${card('CTWA matches',N(a.ctwa))}${card('Ad ID only',N(a.ad_only))}${card('No attribution',N(a.unmatched))}${card('Unknown qual.',N(a.unknown_qualification))}${card('Creative URL',N(a.creative_ok))}${card('No URL',N(a.creative_missing))}${card('Ambiguous URL',N(a.creative_ambiguous))}${card('Meta ID precision','0','CSV strings')}</div><div class="grid cols"><div class="card"><h3>File reconciliation</h3><div class="tablewrap"><table><thead><tr><th>Файл</th><th class="num">Rows</th><th class="num">Spend USD</th></tr></thead><tbody>${a.files.map(f=>`<tr><td>${f.file}</td><td class="num">${N(f.rows)}</td><td class="num">${usd(f.spend_usd)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>Creative URL policy</h3><p class="desc">Только публичные Instagram post/reel/tv и fb.me без query/fragment. WhatsApp preview исключены. Канонический URL — самый частый в CRM, затем стабильная сортировка. Неоднозначность сохраняется как quality flag.</p><div class="notice ${D.private?'':'warn'}">${D.private?'Private build: доступны альтернативные URL и CRM drill-down.':`Public build: deal rows отсутствуют; revenue подавляется при k < ${D.k}.`}</div></div></div>`}
function renderConfig(){let rows=Object.keys(COLS).map(k=>({k,on:custom.includes(k),pos:custom.indexOf(k)})).sort((a,b)=>(a.on?0:1)-(b.on?0:1)||(a.pos-b.pos));$('config').innerHTML=`<div class="row"><strong>Колонки · Мой вид</strong><span class="spacer"></span><button class="btn" id="closeConfig">✕</button></div>${rows.map(r=>`<div class="config-row"><input type="checkbox" data-col="${r.k}" ${r.on?'checked':''}><span>${COLS[r.k].l}<small class="muted"> · ${COLS[r.k].g}</small></span><button class="btn" data-up="${r.k}">↑</button><button class="btn" data-down="${r.k}">↓</button></div>`).join('')}`;$('config').classList.add('open');$('closeConfig').onclick=()=>$('config').classList.remove('open');document.querySelectorAll('[data-col]').forEach(e=>e.onchange=()=>{let k=e.dataset.col;if(e.checked&&!custom.includes(k))custom.push(k);if(!e.checked)custom=custom.filter(x=>x!==k);S.view='custom';localStorage.setItem('skvoz_v04_columns',JSON.stringify(custom));save();render();renderConfig()});document.querySelectorAll('[data-up],[data-down]').forEach(e=>e.onclick=()=>{let k=e.dataset.up||e.dataset.down,i=custom.indexOf(k),j=e.dataset.up?i-1:i+1;if(i>=0&&j>=0&&j<custom.length)[custom[i],custom[j]]=[custom[j],custom[i]];S.view='custom';localStorage.setItem('skvoz_v04_columns',JSON.stringify(custom));save();render();renderConfig()})}
function openAd(i){let x=aggregateAds().find(a=>a.i===i)||blank(i),peers=aggregateAds().filter(a=>a.adset===x.adset&&a.i!==i),med=k=>{let v=peers.map(a=>a[k]).filter(v=>v!=null).sort((a,b)=>a-b);return v.length?v[Math.floor(v.length/2)]:null},cmp=(k,lower=true)=>{let m=med(k),v=x[k];if(v==null||m==null)return'Нет данных';let good=lower?v<=m:v>=m;return`<span class="${good?'good':'bad'}">${good?'лучше':'хуже'} медианы · ${N(m,2)}</span>`},ds=daily([x]);$('detail').innerHTML=`<div class="paneltop"><div><span class="badge">${esc(x.mechanism)}</span><h2>${esc(x.name)}</h2><div class="muted">${x.id} <button class="copy" data-copy="${x.id}">⧉ Copy</button></div></div><button class="btn" id="closePanel">Закрыть ✕</button></div><p>${esc(x.campaign)} → ${esc(x.adset)}</p><div class="row">${x.creative_url?`<a class="btn" href="${esc(x.creative_url)}" target="_blank" rel="noopener">Посмотреть креатив ↗</a>`:'<span class="btn">Ссылка не найдена</span>'}${x.meta_url?`<a class="btn" href="${esc(x.meta_url)}" target="_blank" rel="noopener">Открыть в Meta ↗</a>`:''}</div><div class="grid kpis">${card('Spend',dual(x.spendU,x.spendK))}${card('Meta Results',N(x.results),x.result_type||'mixed')}${card('CRM Leads',N(x.leads))}${card('CTWA',N(x.ctwa))}${card('Qualified',N(x.ql),P(x.qrate))}${card('Sales',N(x.sales))}${card('Revenue',x.revenueKnown?kzt(x.revenue):'Подавлено')}${card('CPL',dual(x.cplU,x.cplK))}${card('CPQL',dual(x.cpqlU,x.cpqlK))}${card('CPS',dual(x.cpsU,x.cpsK))}${card('CAC','Нет данных','Contact ID отсутствует')}${card('ROAS',x.roas==null?'—':N(x.roas,2)+'×')}</div><h3>Дневная динамика</h3><div class="card chart">${line(ds,['spend','results','leads','ql','sales'],['#69ddb2','#39bfd6','#72a7ff','#f0bd6c','#e67b82'])}</div><h3>Воронка</h3><div class="funnel">${[['Impressions',x.impr],['Link Clicks',x.linkc],['Meta Results',x.results],['CRM Leads',x.leads],['QL',x.ql],['Sales',x.sales]].map((v,j,a)=>`<div class="step"><small>${v[0]}</small><b>${N(v[1])}</b>${j?`<small>${P(safe(v[1],a[j-1][1])*100)}</small>`:''}</div>`).join('')}</div><h3>Сравнение с медианой Ad Set</h3><div class="compare"><div><small>CPL</small><b>${cmp('cplU',true)}</b></div><div><small>CPQL</small><b>${cmp('cpqlU',true)}</b></div><div><small>Qual. Rate</small><b>${cmp('qrate',false)}</b></div><div><small>CPS</small><b>${cmp('cpsU',true)}</b></div></div><h3>Факты об объявлении</h3><p>Created: ${x.created||'Нет данных'} · First observed: ${x.first_activity} · First spend: ${x.first_spend||'—'} · Last observed: ${x.last_activity} · Last spend: ${x.last_spend||'—'} · Spend days: ${x.spend_days} · Snapshot status: ${esc(x.status)}. <strong>Last spend не является датой фактического отключения.</strong></p><p><b>Headline:</b> ${esc(x.headline||'Нет данных')}</p><p><b>Text:</b> ${esc(x.text||'Нет данных')}</p>${D.private?privateDeals(x):'<div class="notice warn">CRM drill-down отключён в публичной сборке.</div>'}`;$('shade').classList.add('open');$('panel').classList.add('open');$('closePanel').onclick=closePanel;bindActions()}
function privateDeals(x){let ds=D.deals.filter(d=>d.ad_id===x.id&&range(d.created));return`<h3>Связанные CRM-сделки · ${ds.length}</h3><div class="tablewrap"><table><thead><tr><th>Deal ID</th><th>Created</th><th>Qualified</th><th>Sale</th><th>Payment</th><th>Revenue</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${d.deal_id}</td><td>${d.created}</td><td>${d.qualified}</td><td>${d.sale}</td><td>${d.payment_date||'—'}</td><td>${kzt(d.revenue)}</td></tr>`).join('')}</tbody></table></div>`}function closePanel(){$('shade').classList.remove('open');$('panel').classList.remove('open')}
function bindActions(){document.querySelectorAll('[data-stop]').forEach(e=>e.onclick=ev=>ev.stopPropagation());document.querySelectorAll('[data-copy]').forEach(e=>e.onclick=async ev=>{ev.stopPropagation();await navigator.clipboard.writeText(e.dataset.copy);e.textContent='✓'});document.querySelectorAll('[data-row]').forEach(e=>e.onclick=()=>openAd(+e.dataset.row));document.querySelectorAll('[data-sort]').forEach(e=>e.onclick=()=>{let k=e.dataset.sort;if(S.sort===k)S.desc=!S.desc;else{S.sort=k;S.desc=true}save();render()});document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{S.view=e.dataset.view;S.page=1;save();render()});document.querySelectorAll('[data-group]').forEach(e=>e.onclick=()=>{if(e.dataset.kind==='campaign'){S.campaign=e.dataset.group;S.adset=''}else S.adset=e.dataset.group;S.tab='ads';save();sync();render()});document.querySelectorAll('[data-mini]').forEach(e=>e.onclick=()=>{S.ad=D.ads[+e.dataset.mini].id;S.tab='ads';save();sync();render()});if($('searchAds'))$('searchAds').oninput=e=>{S.search=e.target.value;S.page=1;save();render()};if($('prevPage'))$('prevPage').onclick=()=>{S.page=Math.max(1,S.page-1);render()};if($('nextPage'))$('nextPage').onclick=()=>{S.page++;render()};if($('columns'))$('columns').onclick=renderConfig;if($('resetColumns'))$('resetColumns').onclick=()=>{custom=VIEWS.main.slice();S.view='main';localStorage.removeItem('skvoz_v04_columns');save();render()};if($('export'))$('export').onclick=()=>exportRows(aggregateAds().filter(pass))}
function exportRows(rows){let keys=custom,cell=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv='\ufeff'+[keys.map(k=>cell(COLS[k].l)).join(','),...rows.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`skvoznyak_ads_${S.from}_${S.to}.csv`;a.click();URL.revokeObjectURL(a.href)}
function render(){let pages=[['ads','Объявления'],['overview','Обзор'],['campaigns','Кампании'],['adsets','Ad Sets'],['sales','Продажи'],['quality','Качество данных']];$('nav').innerHTML=pages.map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?'active':''}"><b></b>${x[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{S.tab=e.dataset.tab;$('side').classList.remove('open');save();render()});let names={ads:['Объявления','Главное рабочее место таргетолога: Meta, CRM, продажи и финансовые показатели в одной таблице.'],overview:['Обзор','Управленческий экран по выбранному аналитическому scope.'],campaigns:['Кампании','Клик по кампании открывает её объявления.'],adsets:['Ad Sets','Клик по группе открывает принадлежащие ей объявления.'],sales:['Продажи','Подтверждённые оплаты и безопасные агрегаты.'],quality:['Качество данных','Reconciliation, attribution и creative URL coverage.']};$('title').textContent=names[S.tab][0];$('subtitle').textContent=names[S.tab][1];$('scopeBadge').textContent=`${S.model==='cohort'?'LEAD COHORT':'CALENDAR'} · ${S.from} → ${S.to}`;$('notice').innerHTML=S.model==='cohort'?`<div class="notice ${D.private?'':'warn'}"><strong>Lead Cohort.</strong> Лиды созданы в диапазоне; ${D.private?'последующие оплаты включены после конца периода.':'в public build последующие продажи нельзя связать без deal-level данных, поэтому финансовые cohort-метрики ограничены.'}</div>`:'';let body=S.tab==='ads'?adsPage():S.tab==='overview'?overview():S.tab==='campaigns'?groupTable(aggregateAds(),'campaign'):S.tab==='adsets'?groupTable(aggregateAds(),'adset'):S.tab==='sales'?salesPage():quality();$('content').innerHTML=body;bindActions();syncOptions();save()}
function opt(id,values,label,current){let e=$(id);e.innerHTML=`<option value="">${label}</option>`+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru')).map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function syncOptions(){opt('campaign',D.ads.map(a=>a.campaign),'Все кампании',S.campaign);opt('adset',D.ads.filter(a=>!S.campaign||a.campaign===S.campaign).map(a=>a.adset),'Все Ad Sets',S.adset);let ae=$('ad');ae.innerHTML='<option value="">Все объявления</option>'+D.ads.filter(a=>(!S.campaign||a.campaign===S.campaign)&&(!S.adset||a.adset===S.adset)).map(a=>`<option value="${a.id}" ${a.id===S.ad?'selected':''}>${esc(a.name)} · ${a.id}</option>`).join('');opt('mechanism',D.ads.map(a=>a.mechanism),'Все механики',S.mechanism);opt('status',D.ads.map(a=>a.status),'Все статусы',S.status);for(let id of['campaign','adset','ad','mechanism','status'])$(id).onchange=e=>{S[id]=e.target.value;if(id==='campaign'){S.adset='';S.ad=''}if(id==='adset')S.ad='';S.page=1;save();render()}}
function dateShift(months){let d=new Date(S.from+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+months,1);let f=d.toISOString().slice(0,10);d.setUTCMonth(d.getUTCMonth()+1,0);S.from=f;S.to=d.toISOString().slice(0,10);render()}function quickDate(v){let end=new Date(D.date_max+'T00:00:00Z'),start=new Date(end);if(v==='all'){S.from=D.date_min;S.to=D.date_max}if(v==='today')S.from=S.to=D.date_max;if(v==='yesterday'){end.setUTCDate(end.getUTCDate()-1);S.from=S.to=end.toISOString().slice(0,10)}if(v==='last7'||v==='last30'){start.setUTCDate(end.getUTCDate()-(v==='last7'?6:29));S.from=start.toISOString().slice(0,10);S.to=D.date_max}if(v==='week'){start.setUTCDate(end.getUTCDate()-((end.getUTCDay()+6)%7));S.from=start.toISOString().slice(0,10);S.to=D.date_max}if(v==='month'||v==='prevmonth'){let delta=v==='prevmonth'?-1:0;start=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth()+delta,1));let z=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0));S.from=start.toISOString().slice(0,10);S.to=z.toISOString().slice(0,10)}render()}
function sync(){$('from').value=S.from;$('to').value=S.to;$('model').value=S.model;$('currency').value=S.currency;for(let id of['minSpend','maxSpend','minCpql','maxCpql','minCps','maxCps','minRoas','maxRoas','minQrate','minDays','firstFrom','firstTo'])$(id).value=S[id];$('buildType').textContent=D.private?'PRIVATE BUILD':'PUBLIC SAFE BUILD';$('buildNote').textContent=D.private?'CRM drill-down доступен локально.':`CRM rows отсутствуют · revenue k≥${D.k}.`;let q=[['all','Все'],['spend','С расходом'],['nospend','Без расхода'],['bestroas','Лучшие ROAS'],['bestql','Лучшие QL'],['bestsales','Лучшие продажи'],['wasteql','Расход без QL'],['wastesales','Расход без продаж'],['qlnosales','QL без продаж'],['new','Новые периода']];$('quickFilters').innerHTML=q.map(x=>`<button class="chip ${S.quick===x[0]?'active':''}" data-quick="${x[0]}">${x[1]}</button>`).join('')+'<button class="chip" id="reset">Сбросить всё</button>';document.querySelectorAll('[data-quick]').forEach(e=>e.onclick=()=>{S.quick=e.dataset.quick;S.page=1;render()});$('reset').onclick=()=>{S={...defaults};sync();render()}}
$('from').onchange=e=>{S.from=e.target.value;render()};$('to').onchange=e=>{S.to=e.target.value;render()};$('model').onchange=e=>{S.model=e.target.value;render()};$('currency').onchange=e=>{S.currency=e.target.value;render()};$('quickDate').onchange=e=>quickDate(e.target.value);$('prevMonth').onclick=()=>dateShift(-1);$('nextMonth').onclick=()=>dateShift(1);$('advancedBtn').onclick=()=>$('advanced').classList.toggle('open');for(let id of['minSpend','maxSpend','minCpql','maxCpql','minCps','maxCps','minRoas','maxRoas','minQrate','minDays','firstFrom','firstTo'])$(id).onchange=e=>{S[id]=e.target.value;S.page=1;render()};$('menu').onclick=()=>$('side').classList.toggle('open');$('shade').onclick=closePanel;sync();render()})();
</script></body></html>
